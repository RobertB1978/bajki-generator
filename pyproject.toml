[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bajki-generator"
version = "0.1.0"
description = "Prosty generator bajek z opcją tworzenia narracji audio"
authors = [{ name = "Zespół Bajki", email = "kontakt@example.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
bajki-generator = "bajki_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
