[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "bajki-generator"
version = "0.1.0"
description = "Serwer FastAPI generujący bajki dla dzieci"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Fluxify", email = "hello@fluxify.ai" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109,<1.0",
    "uvicorn[standard]>=0.24,<1.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25,<0.28",
    "typer>=0.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.7",
    "pytest>=7.4",
]

[tool.ruff]
line-length = 100
src = ["apps", "scripts"]
select = ["E", "F", "I", "N", "W", "B"]

[tool.ruff.per-file-ignores]
"apps/api/main.py" = ["B008"]
"scripts/story_cli.py" = ["B008"]
